default:
all_set:
  metrics:
    system.memory.usage:
      enabled: true
      attributes: ["state"]
  resource_attributes:
    resource.id:
      enabled: true
reaggregate_set:
  metrics:
    system.memory.usage:
      enabled: true
      attributes: []
  resource_attributes:
    resource.id:
      enabled: true
none_set:
  metrics:
    system.memory.usage:
      enabled: false
      attributes: ["state"]
  resource_attributes:
    resource.id:
      enabled: false
filter_set_include:
  resource_attributes:
    resource.id:
      enabled: true
      metrics_include:
        - regexp: ".*"
filter_set_exclude:
  resource_attributes:
    resource.id:
      enabled: true
      metrics_exclude:
        - strict: "resource.id-val"
