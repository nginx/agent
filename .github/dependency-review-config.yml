allow_licenses:
  - Apache-1.1
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSL-1.0
  - ISC
  - MIT
  - MPL-2.0
  - NCSA
  - OpenSSL
  - Python-2.0
  - X11
  - CC0-1.0
  - CC-BY-4.0
  - LicenseRef-scancode-google-patent-license-golang
  - LicenseRef-scancode-public-domain
  - LicenseRef-scancode-w3c-03-bsd-license
allow-dependencies-licenses:
  - 'pkg:githubactions/fossas/fossa-action'
  - 'pkg:githubactions/opentofu/setup-opentofu'
  - 'pkg:golang/github.com/shoenig/go-m1cpu'
  - 'pkg:pypi/pytest-metadata'
  # Dual Apache-2.0 + BSD-3-Clause; ScanCode reports a non-standard combined
  # LicenseRef-bad-apache-2.0-bsd-3-clause id that is not SPDX-mappable.
  - 'pkg:golang/go.opentelemetry.io/contrib/detectors/aws/ec2/v2'
  - 'pkg:golang/go.opentelemetry.io/contrib/detectors/aws/eks'
  - 'pkg:golang/go.opentelemetry.io/contrib/detectors/azure/azurevm'
comment-summary-in-pr: on-failure
