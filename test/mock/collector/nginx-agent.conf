#
# /etc/nginx-agent/nginx-agent.conf
#
# Configuration file for NGINX Agent.
#

log:
  # set log level (error, warn, info, debug; default "info")
  level: debug
  # set log path. if empty, don't log to file.
  path: /var/log/nginx-agent/

watchers:
  instance_watcher:
    monitoring_frequency: 5s
  instance_health_watcher:
    monitoring_frequency: 5s

data_plane_config:
  nginx:
    reload_monitoring_period: 5s
    treat_warnings_as_errors: true

allowed_directories: 
    - /etc/nginx
    - /usr/local/etc/nginx
    - /usr/share/nginx/modules
    - /var/run/nginx
    
labels:
  product-type: mock-product
  product-version: v1.0.0 

client:
  http:
    timeout: 10s

collector:
  log:
    level: INFO
  receivers:
    container_metrics:
      collection_interval: 15s
    host_metrics:
      collection_interval: 15s
      initial_delay: 1s
      scrapers:
        disk: {}
        network: {}
        filesystem: {}
  processors:
    batch: 
      "default":
        timeout: 200ms
        send_batch_size: 50
        send_batch_max_size: 500
    resource:
      "default":
        attributes:
          - key: resource.id
            action: insert
            value: "test-placeholder"
  exporters:
    debug: {}
    otlp:
      "default":
        server:
          host: "otel-collector"
          port: 4317
  pipelines:
    metrics:
      "default":
        receivers: ["host_metrics", "nginx_metrics"]
        processors: ["batch/default"]
        exporters: ["otlp/default", "debug"]
