receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: headers_check
exporters:
  prometheus:
    endpoint: "0.0.0.0:9775"
    resource_to_telemetry_conversion:
      enabled: true
      # In OTel v0.157.0 the feature gate exporter.prometheusexporter.DisableAddMetricSuffixes
      # moved to Beta (enabled by default), which makes add_metric_suffixes be ignored and
      # falls back to the default UnderscoreEscapingWithSuffixes strategy. That appends unit
      # suffixes (e.g. nginx_http_request_count -> nginx_http_request_count_requests) and
      # _total to counters, so the metric names the tests look for no longer exist.
      # Explicitly select the no-suffix strategy to preserve the pre-upgrade metric names.
      translation_strategy: UnderscoreEscapingWithoutSuffixes
    add_metric_suffixes: false
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200
  otlp_http:
    endpoint: http://loki:3100/otlp

processors:
  batch:
  resource:
    attributes:
      - key: service.name
        value: "nginx.app.protect"
        action: insert

extensions:
  headers_check:

service:
  telemetry:
    logs:
      level: "debug"
  extensions: [ headers_check ]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp_http]
